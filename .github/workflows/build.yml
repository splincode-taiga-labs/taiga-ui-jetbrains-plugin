name: Build

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read
    id-token: write

concurrency:
    group: build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      test-fixtures/package-lock.json

            - name: Install root npm fixture
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Install Taiga UI version workspaces
              run: npm run install:fixtures --prefix test-fixtures

            - name: Verify pnpm workspace frozen install
              working-directory: test-fixtures/package-manager-workspaces/pnpm-workspaces
              run: |
                  corepack pnpm install --frozen-lockfile --ignore-scripts
                  test -L apps/demo/node_modules/@taiga-ui/design-tokens
                  test -f apps/demo/node_modules/@taiga-ui/design-tokens/package.json
                  test "$(node -p "require('./apps/demo/node_modules/@taiga-ui/design-tokens/package.json').version")" = "0.322.0"
                  git diff --exit-code -- pnpm-lock.yaml

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Verify contextual documentation
              env:
                  JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
              run: >-
                  ./gradlew
                  test
                  --tests 'org.taigaui.designtokens.documentation.TaigaQuickDocumentation*'
                  --tests 'org.taigaui.designtokens.documentation.TaigaLocalDocumentationTest'
                  -Djava.net.useSystemProxies=false
                  --stacktrace

            - name: Check and build plugin
              env:
                  JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
              run: >-
                  ./gradlew
                  check
                  buildPlugin
                  verifyPluginStructure
                  verifyPluginProjectConfiguration
                  -Djava.net.useSystemProxies=false
                  --stacktrace

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  use_oidc: true
                  files: ./build/reports/jacoco/test/jacocoTestReport.xml
                  disable_search: true
                  flags: unit
                  name: unit-tests
                  fail_ci_if_error: true

            - name: Upload plugin and contextual documentation previews
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: taiga-ui-contextual-documentation
                  if-no-files-found: ignore
                  path: |
                      build/distributions/*.zip
                      build/reports/quick-documentation/*.png
                      build/test-results/test/TEST-*Documentation*.xml

            - name: Verify packaged plugin icons
              run: bash scripts/verify-plugin-icons.sh

    plugin-verifier:
        name: Plugin Verifier
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Cache IntelliJ Platform IDEs
              uses: actions/cache@v4
              with:
                  path: .intellijPlatform/ides
                  key: intellij-platform-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
                  restore-keys: |
                      intellij-platform-${{ runner.os }}-

            - name: Verify plugin compatibility
              env:
                  JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}
              run: >-
                  ./gradlew
                  verifyPlugin
                  -Djava.net.useSystemProxies=false
                  --stacktrace
