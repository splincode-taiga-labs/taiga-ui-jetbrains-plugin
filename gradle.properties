pluginGroup = org.taigaui.designtokens
pluginVersion = 0.1.0-SNAPSHOT
platformVersion = 2025.3.6
supportedIdeSinceBuild = 253
supportedIdeUntilBuild = 263.*
pluginVerifierIdeVersions = 2025.3,2026.1.5,2026.2.3,2026.3

# Do not bundle Kotlin stdlib because it is provided by the IntelliJ Platform.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.jetbrains.intellij.platform.intellijPlatformIdesCacheEnabled = true

# IntelliJ Platform classpath snapshots can exceed Gradle's default heap on cold CI builds.
org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
